org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# JAVA_HOME on this machine points at a Java 8 JDK, which Gradle 8.14/AGP
# can't build with (needs 11+, and Java 8's loopback-socket handling on
# Windows also breaks the Gradle daemon's own IPC). Pin the project to the
# JDK 17 install instead of relying on the system-wide JAVA_HOME.
#org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.19.10-hotspot
org.gradle.java.home=/usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
# The Gradle daemon intermittently fails to start on this machine ("Unable
# to establish loopback connection" / "first result from the daemon was
# empty") — its self-connect IPC socket gets blocked, most likely by local
# antivirus/firewall/EDR software intercepting a newly-spawned JVM child
# process. This setting reduces how often that path is hit, but doesn't
# fully avoid it — see CLAUDE.md for the actual fix (an AV/firewall
# exclusion) if builds still fail intermittently.
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
