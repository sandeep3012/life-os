org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Do NOT pin org.gradle.java.home here. It is an absolute, machine-specific
# path in a committed file, so it hard-fails on every other machine ("Java
# home supplied is invalid"). Gradle 8.14 + AGP 8.11 need JDK 17-21 (JDK 25
# is rejected outright), so each machine selects its own JDK out-of-tree:
#   flutter config --jdk-dir="<path to a JDK 17-21>"
# which Flutter passes to Gradle per-invocation. See CLAUDE.md for how to
# find a suitable JDK on macOS and on Windows.
# The Gradle daemon intermittently fails to start on this machine ("Unable
# to establish loopback connection" / "first result from the daemon was
# empty") — its self-connect IPC socket gets blocked, most likely by local
# antivirus/firewall/EDR software intercepting a newly-spawned JVM child
# process. This setting reduces how often that path is hit, but doesn't
# fully avoid it — see CLAUDE.md for the actual fix (an AV/firewall
# exclusion) if builds still fail intermittently.
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
